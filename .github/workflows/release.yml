name: Publish ZRYSPOTY
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: zryspoty-v1-0-5

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate web code and install packaging tools
        run: |
          node --check app.js
          node --check sw.js
          node packaging/tests/spotify-links.cjs
          node packaging/tests/profiles.cjs
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak clang lld llvm
      - name: Build and inspect desktop packages
        run: |
          curl -fLsS -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool' | sha256sum -c -
          chmod +x appimagetool
          mkdir -p packages
          go test packaging/player/main.go packaging/player/main_test.go
          export ZRYSPOTY_PLAYER_LINUX="$RUNNER_TEMP/zryspoty-player"
          export ZRYSPOTY_PLAYER_WINDOWS="$RUNNER_TEMP/zryspoty-player.exe"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$ZRYSPOTY_PLAYER_LINUX" packaging/player/main.go
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w -H=windowsgui' -o "$ZRYSPOTY_PLAYER_WINDOWS" packaging/player/main.go
          tar -xzf downloads/ZRYSPOTY-Linux.tar.gz
          cmp app.js ZRYSPOTY/app.js
          sh packaging/formats/linux.sh ZRYSPOTY packages deb
          sh packaging/formats/linux.sh ZRYSPOTY packages flatpak
          sh packaging/formats/windows.sh ZRYSPOTY packages/ZRYSPOTY-Windows-x64.exe
          APPIMAGETOOL="$PWD/appimagetool" sh packaging/formats/linux.sh ZRYSPOTY packages appimage
          packages/ZRYSPOTY-Linux-x86_64.AppImage --appimage-extract >/dev/null
          cmp app.js squashfs-root/usr/share/zryspoty/app.js
      - uses: actions/upload-artifact@v4
        with:
          name: ZRYSPOTY-desktop
          path: packages/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and verify test APK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          unzip -q downloads/ZRYSPOTY-Android-projekt.zip
          cmp app.js ZRYSPOTY-Android/web/app.js
          gradle -p ZRYSPOTY-Android assembleDebug
          cp ZRYSPOTY-Android/build/outputs/apk/debug/*-debug.apk ZRYSPOTY-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify ZRYSPOTY-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZRYSPOTY-APK
          path: ZRYSPOTY-Android.apk
          if-no-files-found: error

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.0.5 >/dev/null 2>&1; then
            gh release upload v1.0.5 release/* --clobber
          else
            gh release create v1.0.5 release/* --target "$GITHUB_SHA" --title 'ZRYSPOTY 1.0.5' --notes 'Odtwarzanie Spotify i YouTube na ekranie ZRYSPOTY. APK jest podpisany kluczem testowym.'
          fi
